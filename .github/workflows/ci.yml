name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-placeholder-nextauth-secret-min-32-chars
      DATABASE_URL: "file:./db/custom.db"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Prepare database for smoke
        run: bun run db:migrate:deploy

      - name: Seed smoke user
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "${SMOKE_PASSWORD:-}" ]; then
            echo "SMOKE_PASSWORD secret not set; skipping seed and smoke"
            exit 0
          fi
          bun run scripts/seed-data.ts 0 "${SMOKE_EMAIL:-test@example.com}" "$SMOKE_PASSWORD"

      - name: Start server for smoke
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "${SMOKE_PASSWORD:-}" ]; then
            exit 0
          fi
          bun run start &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "Server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready on port 3000"
          exit 1

      - name: API smoke tests
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          CI: "1"
          SMOKE_BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
        run: |
          if [ -z "${SMOKE_PASSWORD:-}" ]; then
            exit 0
          fi
          bun run test:smoke

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
          pkill -f ".next/standalone/server.js" 2>/dev/null || true
